# Snapshot al /etc/nginx/sites-available/n8n — resincronizat 2026-07-31.
# nginx ruleaza pe host (systemd), NU in acest stack Compose.
# Fisierul e doar referinta pentru versionare — editarea lui nu afecteaza nimic.
#
# ATENTIE: copia asta a fost invechita intre 2026-07-27 si 2026-07-31 in doua
# feluri care conteaza, deci verific-o inainte sa restaurezi ceva din ea:
#
#   1. X-Forwarded-For era $proxy_add_x_forwarded_for, adica ADAUGA la antetul
#      trimis de client. Live e $remote_addr, adica il SUPRASCRIE. Diferenta e
#      de securitate, nu de stil: N8N_PROXY_HOPS=1 presupune ca n8n primeste un
#      singur XFF curat. Cu varianta "add", cine loveste originea direct isi
#      poate injecta propriul lant si n8n ar citi un IP fals drept client.
#      Vezi comentariul lui N8N_PROXY_HOPS din docker-compose.yml.
#   2. Lipseau proxy_read_timeout / proxy_send_timeout 600s.
#
# Nu exista aici blocul care face nginx sa aiba incredere in CF-Connecting-IP:
# acela e separat, in /etc/nginx/conf.d/cloudflare-realip.conf, si se
# regenereaza cu ./refresh-cloudflare-ips.sh. Cele doua se citesc impreuna.
#
# Diferenta fata de live, oricand:
#   sudo cat /etc/nginx/sites-enabled/* > /tmp/live.conf
#   diff nginx/n8n.conf /tmp/live.conf

server {
    server_name n8n.example.com;

    location / {
        proxy_pass http://localhost:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/n8n.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/n8n.example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = n8n.example.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name n8n.example.com;
    return 404; # managed by Certbot


}
